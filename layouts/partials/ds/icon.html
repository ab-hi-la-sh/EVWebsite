{{- /* The one <Icon> on the page (three persona glyphs). The DS component
       lazy-loaded Lucide from unpkg at runtime just to draw these; the paths
       are inlined here instead, copied from the rendered output. */ -}}
{{- $paths := dict
  "cpu" `<rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path>`
  "git-branch" `<line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path>`
  "lock" `<rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>`
-}}
{{- $size := .size | default 22 -}}
<svg width="{{ $size }}" height="{{ $size }}" viewBox="0 0 24 24" fill="none" stroke="{{ .color | default "var(--ev-mineral-blue)" }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{{ index $paths .name | safeHTML }}</svg>
