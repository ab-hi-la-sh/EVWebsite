# ---------------------------------------------------------------------------
# Caching. The catch-all comes FIRST and the immutable rules after it: when
# several header rules match a path, the more specific/later rule is the one
# that must win, so ordering general -> specific keeps HTML revalidating while
# fingerprinted assets stay immutable.
#
# Hugo fingerprints the CSS/JS bundles and every processed image, so those are
# immutable. /assets/ holds fixed-URL files (og images, favicons, CSS
# backgrounds) which are NOT fingerprinted -- long cache, but not immutable.
#
# netlify dev does not apply these locally; they take effect at the edge, so
# confirm them on the first deploy preview.
# ---------------------------------------------------------------------------

# HTML always re-validates so a publish is reflected immediately.
# The security headers ride on the same catch-all so every response gets them.
# CSP allows any https: origin for scripts/styles/frames because GTM, HubSpot
# forms and Google Fonts load from several hosts; 'unsafe-inline' covers the
# inline GTM snippet and per-page <style> blocks.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
