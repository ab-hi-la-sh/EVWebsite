{{- /* Sitewide Organization + WebSite, plus per-page schema.
       The old site had JSON-LD on 7 of 29 pages; this makes it uniform. */ -}}
{{- if .IsHome -}}
<script type="application/ld+json">{{ (dict
  "@context" "https://schema.org" "@type" "Organization"
  "name" site.Title "url" site.BaseURL
  "logo" (absURL site.Params.logo)
  "sameAs" (slice "https://www.linkedin.com/company/enigma-vault/" "https://x.com/NoPII_HQ")
) | jsonify | safeJS }}</script>
<script type="application/ld+json">{{ (dict
  "@context" "https://schema.org" "@type" "WebSite"
  "name" site.Title "url" site.BaseURL
  "publisher" (dict "@type" "Organization" "name" site.Title)
) | jsonify | safeJS }}</script>
{{- end -}}
{{ partial "schema/breadcrumb.html" . }}
{{ partial "schema/article.html" . }}
{{ partial "schema/faq.html" . }}
