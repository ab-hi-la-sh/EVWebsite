{{- /* BlogPosting for blog articles. Dates are full ISO-8601 datetimes with a timezone offset, which Google's validator requires. */ -}}
{{- if eq .Type "blog" -}}{{- if .IsPage -}}
{{- $a := index hugo.Data.authors .Params.author -}}
<script type="application/ld+json">{{ (dict
  "@context" "https://schema.org" "@type" "BlogPosting"
  "headline" .Title
  "description" (.Params.excerpt | default .Description)
  "image" (absURL .Params.heroImage)
  "datePublished" (.Date.Format "2006-01-02T15:04:05Z07:00")
  "dateModified" (.Lastmod.Format "2006-01-02T15:04:05Z07:00")
  "author" (dict "@type" "Person" "name" $a.name "jobTitle" $a.role)
  "publisher" (dict "@type" "Organization" "name" site.Title "logo" (dict "@type" "ImageObject" "url" (absURL site.Params.logo)))
  "mainEntityOfPage" (dict "@type" "WebPage" "@id" .Permalink)
  "articleSection" .Params.category
  "keywords" (delimit .Params.tags ", ")
) | jsonify | safeJS }}</script>
{{- end -}}{{- end -}}
