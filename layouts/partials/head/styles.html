{{- /*
  CSS is split so the bulk of it stays cacheable across every page:

    1. core     tokens + global.css           identical on all pages
    2. family   page-family sheets            shared within a family
    3. page     the page's own <style> block  inlined (avg 3KB, page-unique)
    4. navfoot  nav.css + footer.css          identical on all pages

  Order reproduces the old pages' order exactly. nav/footer must stay LAST:
  they were injected into <head> at runtime by site-nav.js / site-footer.js,
  after every <link>, and 11 of their selectors are also defined in global.css,
  so moving them earlier would change which rule wins.

  Every bundle goes through partialCached -- see partials/css/bundle.html for
  why a plain resources.Concat raced under concurrent page rendering.

  Frontmatter:  styles: ["vaults.css", "pages/vault-overview.css"]
  Entries under pages/ are inlined rather than linked.
*/ -}}
{{- $core := slice
  "css/tokens/fonts.css" "css/tokens/colors.css" "css/tokens/palette.css"
  "css/tokens/typography.css" "css/tokens/spacing.css" "css/tokens/base.css"
  "css/global.css" "css/picture.css" -}}
{{- $coreCSS := partialCached "css/bundle.html" (dict "paths" $core "name" "core") "core" -}}
{{- $nfCSS := partialCached "css/bundle.html" (dict "paths" (slice "css/nav.css" "css/footer.css") "name" "navfoot") "navfoot" -}}
{{- $fam := slice -}}
{{- $inline := slice -}}
{{- range .Params.styles -}}
  {{- if hasPrefix . "pages/" -}}
    {{- $inline = $inline | append (printf "css/%s" .) -}}
  {{- else -}}
    {{- $fam = $fam | append (printf "css/%s" .) -}}
  {{- end -}}
{{- end -}}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="{{ $coreCSS.RelPermalink }}"{{ with $coreCSS.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}>
{{- with $fam }}
{{- $key := delimit . "|" -}}
{{- $famCSS := partialCached "css/bundle.html" (dict "paths" . "name" (printf "family-%d" ($key | hash.FNV32a))) $key -}}
<link rel="stylesheet" href="{{ $famCSS.RelPermalink }}"{{ with $famCSS.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}>
{{- end }}
{{- with $inline }}
{{- $key := delimit . "|" -}}
{{- $pageCSS := partialCached "css/bundle.html" (dict "paths" . "name" (printf "page-%d" ($key | hash.FNV32a))) $key -}}
<style>{{ $pageCSS.Content | safeCSS }}</style>
{{- end }}
<link rel="stylesheet" href="{{ $nfCSS.RelPermalink }}"{{ with $nfCSS.Data.Integrity }} integrity="{{ . }}" crossorigin="anonymous"{{ end }}>
