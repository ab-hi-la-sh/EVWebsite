stack:
  title: Three layers of trust. One foundation.
  intro: 'Every AI feature has three places where trust can break: the answer it gives, the prompt it
    sends, and the data underneath. Each layer is a product you can buy on its own. Together, they share
    one foundation, one set of keys, and one audit trail.'
  layers:
  - n: '01'
    prod: Triplets
    head: 'Triplets: evidence-grounded AI answers.'
    lead: Confidently wrong ends here.
    body: Triplets checks every AI answer against evidence you approve, and refuses when the evidence
      cannot support one. A confident wrong answer never reaches your user, because it never gets generated.
    proof: compile, verify, refuse when unsupported.
    link: Explore Triplets
    href: /triplets/
  - n: '02'
    prod: NoPII
    head: 'NoPII: PII protection for LLMs.'
    lead: What the model never sees, it can never leak.
    body: Every prompt is scanned for sensitive data and tokenized before it leaves your environment,
      then restored in the response. The model reasons normally. The provider never sees a real identifier.
    proof: detect, tokenize, restore.
    link: Explore NoPII
    href: /nopii/
  - n: '03'
    prod: The Vault
    head: 'The Vault: data tokenization and encryption.'
    lead: Take sensitive data off your books.
    body: Cards, fields, files, and customer records are tokenized and encrypted on certified infrastructure.
      Your systems hold tokens that still work. The real values live in the vault.
    proof: capture, vault, reference.
    link: Explore the Vault
    href: /vault/
    also:
      text: Need secure customer intake instead?
      link: Customer Vault
      href: /vault/customer-vault/
proof:
  title: Proof, not promises.
  sub: Each layer earns trust with a hard fact, measured on your own data.
  items:
  - prod: Triplets
    value: Every
    unit: answer checked against your compiled evidence
    body: Triplets checks whether answers are supported by your compiled evidence and flags conflicts
      or missing support. Refusals and gaps are logged and reported. Evidence support does not establish
      universal truth, medical correctness or regulatory approval.
  - prod: NoPII
    value: 35+
    unit: categories of sensitive data tokenized
    body: Before prompts leave your environment, validated against a published 109-test benchmark, across
      9+ LLM providers. Live in under five minutes.
  - prod: The Vault
    value: AES-256
    unit: encryption with per-tenant key isolation
    body: Full audit logging, on PCI DSS Level 1 and SOC 2 Type II infrastructure. Free to start on AWS
      Marketplace.
