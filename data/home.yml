compete:
  title: You can’t build your way out of this. Or prompt your way out of it.
  blocks:
  - h: The build trap.
    body: Stitch together a reliability library, a redaction proxy, a token vault, and the glue between
      them. Three integrations, three audits, three bills, and the seams are where trust leaks.
  - h: The prompt trap.
    body: Prompt it, fine-tune it, force it deterministic. A prompt is a request, not a constraint, and
      a model cannot police its own output.
  resolveLead: Trust has to be enforced as infrastructure, outside the application and outside the model.
  resolveStrong: That is what the trust layer is.
