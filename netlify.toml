[[redirects]]
  from = "/solutions/industries/insurance.html"
  to = "/solutions/industries/#insurance"
  status = 301

# The 4 Triplets pages were consolidated into one page with anchored sections
# (content/triplets/how-it-works.html, use-cases.html and faqs.html no longer
# exist as separate content -- their content now lives on /triplets/
# as #how-it-works, #use-cases and #faqs). Same pattern as the industries
# sub-page consolidation above, just not force'd: Hugo no longer emits these
# paths at all once the content files are gone, so there is no local file for
# Netlify to prefer over the redirect.
[[redirects]]
  from = "/triplets/how-it-works/"
  to = "/triplets/#how-it-works"
  status = 301
[[redirects]]
  from = "/triplets/use-cases/"
  to = "/triplets/#use-cases"
  status = 301
[[redirects]]
  from = "/triplets/faqs/"
  to = "/triplets/#faqs"
  status = 301
[[redirects]]
  from = "/triplets/overview/"
  to = "/triplets/"
  status = 301

# NoPII consolidated the same way: overview/how-it-works/use-cases/faqs now
# live on /nopii/ as anchored sections.
[[redirects]]
  from = "/nopii/how-it-works/"
  to = "/nopii/#how-it-works"
  status = 301
[[redirects]]
  from = "/nopii/use-cases/"
  to = "/nopii/#use-cases"
  status = 301
[[redirects]]
  from = "/nopii/faqs/"
  to = "/nopii/#faqs"
  status = 301
[[redirects]]
  from = "/nopii/overview/"
  to = "/nopii/"
  status = 301

# The Vault consolidated its overview/how-it-works/use-cases/faqs onto /vault/.
# The four named vault products (card/data/file/customer) stay separate pages.
[[redirects]]
  from = "/vault/how-it-works/"
  to = "/vault/#how-it-works"
  status = 301
[[redirects]]
  from = "/vault/use-cases/"
  to = "/vault/#use-cases"
  status = 301
[[redirects]]
  from = "/vault/faqs/"
  to = "/vault/#faqs"
  status = 301
[[redirects]]
  from = "/vault/overview/"
  to = "/vault/"
  status = 301

# ---------------------------------------------------------------------------
# Caching. The catch-all comes FIRST and the immutable rules after it: when
# several header rules match a path, the more specific/later rule is the one
# that must win, so ordering general -> specific keeps HTML revalidating while
# fingerprinted assets stay immutable.
#
# Hugo fingerprints the CSS/JS bundles and every processed image, so those are
# immutable. /assets/ holds fixed-URL files (og images, favicons, CSS
# backgrounds) which are NOT fingerprinted -- long cache, but not immutable.
#
# netlify dev does not apply these locally; they take effect at the edge, so
# confirm them on the first deploy preview.
# ---------------------------------------------------------------------------

# HTML always re-validates so a publish is reflected immediately.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
