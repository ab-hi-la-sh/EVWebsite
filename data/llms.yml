title: Enigma Vault
summary: 'Enigma Vault is an AI data security company. Three products protect sensitive data across the AI lifecycle: the
  Vault tokenizes and encrypts stored data, NoPII keeps personal data out of LLM prompts, and Triplets grounds AI answers
  in compiled evidence.'
intro: 'Enigma Vault products run on shared infrastructure: the same encryption, tenant isolation, key management, and audit
  logging. Free allowances are available for Card Vault, Data Vault, File Vault, and NoPII. Customer Vault, Agent Vault, and
  Triplets are priced by engagement.'
