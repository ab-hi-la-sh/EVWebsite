# Netlify configuration for the Enigma Vault site (Hugo).
#
# The old site was published as-is with no build step. Hugo now builds it, and
# every URL moved from /page.html to /page/ -- so the redirect block below is
# the complete old-URL surface, one 301 per page.

[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.161.1"
  # Hugo needs the extended build for WebP encoding in the image pipeline.
  HUGO_ENV = "production"

# ---------------------------------------------------------------------------
# Redirects: every URL the old site served, mapped to its clean-URL equivalent.
# ---------------------------------------------------------------------------

# Netlify serves /index.html implicitly, so this one needs force.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/company/about.html"
  to = "/company/about/"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/login.html"
  to = "/login/"
  status = 301
[[redirects]]
  from = "/nopii/faqs.html"
  to = "/nopii/#faqs"
  status = 301
[[redirects]]
  from = "/nopii/how-it-works.html"
  to = "/nopii/#how-it-works"
  status = 301
[[redirects]]
  from = "/nopii/overview.html"
  to = "/nopii/"
  status = 301
[[redirects]]
  from = "/nopii/use-cases.html"
  to = "/nopii/#use-cases"
  status = 301
[[redirects]]
  from = "/platform/data-security.html"
  to = "/platform/data-security/"
  status = 301
[[redirects]]
  from = "/platform/integrations.html"
  to = "/platform/integrations/"
  status = 301
[[redirects]]
