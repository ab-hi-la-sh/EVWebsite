tony-alex:
  name: "Dr. Tony Alex"
  role: "Chief Executive Officer"
  initials: "TA"
  credentials: ""
  bio: ""
  bioParas:
    - "Dr. Tony Alex is Chief Executive Officer of Enigma Vault and a technology entrepreneur with more than two decades of experience building enterprise software businesses. His background spans engineering, product development, and company leadership, including founding US eDirect and leading the business through its acquisition by Tyler Technologies in 2022."
    - "At Enigma Vault, Tony leads the company's work in encryption, tokenization, and sensitive-data protection. The platform helps businesses protect card information, customer data, and files through services that integrate with their applications. His focus builds on years of developing software for organizations where transaction reliability, information security, and ease of use are central to daily operations."
    - "Tony founded US eDirect in 1999 to develop software for parks, campgrounds, and recreation agencies. Its Recreation Dynamics platform brought reservations, payments, memberships, passes, rentals, and other operational transactions into a single enterprise cloud system. By the time Tyler Technologies acquired the company, US eDirect served 40 customers across the United States, Canada, Australia, and New Zealand. Customers included Florida, Ohio, Minnesota, and Missouri state park systems, alongside Queensland Parks and Wildlife Service in Australia."
    - "His broader experience includes serving as President of Yodel Pass and as a board member at Litmoves.io. He is also an advisor at LANDED, which supports companies entering the US market, where his areas of expertise include engineering, product innovation, and cybersecurity."
    - "Tony holds a Ph.D. in Chemical and Biomolecular Engineering from Rutgers University and studied at the Indian Institute of Technology, Roorkee. His advisor profile at LANDED credits him with 17 patents. He brings this combination of scientific training, software development experience, and business leadership to Enigma Vault's product direction and company strategy."
  linkedin: "https://www.linkedin.com/in/tony-alex-enigma-vault/"
